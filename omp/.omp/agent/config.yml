modelRoles:
  default: openai-codex/gpt-5.5:medium
  advisor: openai-codex/gpt-5.6-sol:high
  plan: openai-codex/gpt-5.6-sol:high
  slow: openai-codex/gpt-5.6-sol:xhigh
  smol: openai-codex/gpt-5.4-mini:medium
symbolPreset: nerd
composer:
  shape: borderless
theme:
  dark: dark-cosmos
  light: light-github
setupVersion: 2
colorBlindMode: false
images:
  blockImages: false
tools:
  approvalMode: write
  approval:
    read: allow
    edit: allow
    bash: prompt
bash:
  patterns:
    - match: rm -rf *
      approval: deny
    - match: git status*
      approval: allow
    - match: git -C * status*
      approval: allow
    - match: git diff*
      approval: allow
    - match: git -C * diff*
      approval: allow
    - match: git log*
      approval: allow
    - match: git -C * log*
      approval: allow
    - match: git show*
      approval: allow
    - match: git -C * show*
      approval: allow
    - match: git branch*
      approval: allow
    - match: git -C * branch*
      approval: allow
    - match: git rev-parse*
      approval: allow
    - match: git -C * rev-parse*
      approval: allow
    - match: git submodule status*
      approval: allow
    - match: git -C * submodule status*
      approval: allow
    - match: pnpm test*
      approval: allow
    - match: pnpm run test*
      approval: allow
    - match: pnpm lint*
      approval: allow
    - match: pnpm run lint*
      approval: allow
    - match: pnpm check*
      approval: allow
    - match: pnpm run check*
      approval: allow
    - match: pnpm typecheck*
      approval: allow
    - match: pnpm run typecheck*
      approval: allow
    - match: bun test*
      approval: allow
    - match: bun lint*
      approval: allow
    - match: bun check*
      approval: allow
    - match: bun run test*
      approval: allow
    - match: bun run lint*
      approval: allow
    - match: bun run check*
      approval: allow
    - match: bun run typecheck*
      approval: allow
    - match: npm test*
      approval: allow
    - match: npm run test*
      approval: allow
    - match: npm run lint*
      approval: allow
    - match: npm run check*
      approval: allow
    - match: npm run typecheck*
      approval: allow
    - match: pwd
      approval: allow
    - match: ls*
      approval: allow
    - match: "*"
      approval: prompt
defaultThinkingLevel: medium
dev:
  autoqaConsent: granted
extendedContext: false
codexResets:
  autoRedeem: "yes"
advisor:
  enabled: false
statusLine:
  compactThinkingLevel: false