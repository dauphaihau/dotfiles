modelRoles:
  default: opencode-go/deepseek-v4.1-flash:off
  advisor: openai-codex/gpt-6-astra:off
  slow: opencode-go/deepseek-v4.1-flash:low
  smol: opencode-go/deepseek-v4.1-flash:off
  task: opencode-go/deepseek-v4.1-flash:off
  architect: openai-codex/gpt-6.1-sol:low
  architecture-2: openai-codex/gpt-6-astra:low
  architecture-3: opencode-go/glm-5.3-flash:low
  architecture-4: opencode-go/deepseek-v4.1-flash:low
  architecture-5: opencode-go/kimi-k2.7-code:low
task:
  agentModelOverrides:
    task: "@task"
symbolPreset: nerd
composer:
  shape: borderless
  tokenRate: false
theme:
  dark: dark-cosmos
  light: light-github
setupVersion: 2
colorBlindMode: false
images:
  blockImages: false
tools:
  approvalMode: yolo
  approval:
    read: allow
    edit: allow
    bash: allow
bash:
  patterns:
    - match: rm -rf *
      approval: deny
    - match: pwd
      approval: allow
    - match: ls*
      approval: allow
defaultThinkingLevel: medium
dev:
  autoqaConsent: granted
extendedContext: false
codexResets:
  autoRedeem: "no"
advisor:
  enabled: false
statusLine:
  compactThinkingLevel: false
  transparent: false
retry:
  waitForUsageReset: true
  fallbackChains:
    opencode-go/kimi-k2.7-code:
      - openai-codex/gpt-6-luna:off
    opencode-go/deepseek-v4.1-flash:
      - openai-codex/gpt-6-luna:off
  usageAwareFallback: true
  modelFallback: true
display:
  showTokenUsage: true
cycleOrder:
  []