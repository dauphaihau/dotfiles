modelRoles:
  default: openai-codex/gpt-5.5:medium
  advisor: openai-codex/gpt-5.6-sol:high
  plan: openai-codex/gpt-5.6-sol:high
  slow: openai-codex/gpt-5.6-sol:xhigh
  smol: openai-codex/gpt-5.4-mini:medium

symbolPreset: nerd

composer:
  shape: borderless

theme:
  dark: dark-cosmos
  light: light-github

setupVersion: 2
colorBlindMode: false

images:
  blockImages: false

# skills:
#   includeSkills:
#     - ask
#     - commit-group

tools:
  approvalMode: write
  approval:
    read: allow
    edit: allow
    bash: prompt

bash:
  patterns:
    # Destructive commands
    - match: "rm -rf *"
      approval: deny

    # Git inspection
    - match: "git status*"
      approval: allow
    - match: "git -C * status*"
      approval: allow
    - match: "git diff*"
      approval: allow
    - match: "git -C * diff*"
      approval: allow
    - match: "git log*"
      approval: allow
    - match: "git -C * log*"
      approval: allow
    - match: "git show*"
      approval: allow
    - match: "git -C * show*"
      approval: allow
    - match: "git branch*"
      approval: allow
    - match: "git -C * branch*"
      approval: allow
    - match: "git rev-parse*"
      approval: allow
    - match: "git -C * rev-parse*"
      approval: allow
    - match: "git submodule status*"
      approval: allow
    - match: "git -C * submodule status*"
      approval: allow

    # pnpm verification
    - match: "pnpm test*"
      approval: allow
    - match: "pnpm run test*"
      approval: allow
    - match: "pnpm lint*"
      approval: allow
    - match: "pnpm run lint*"
      approval: allow
    - match: "pnpm check*"
      approval: allow
    - match: "pnpm run check*"
      approval: allow
    - match: "pnpm typecheck*"
      approval: allow
    - match: "pnpm run typecheck*"
      approval: allow

    # bun verification
    - match: "bun test*"
      approval: allow
    - match: "bun lint*"
      approval: allow
    - match: "bun check*"
      approval: allow
    - match: "bun run test*"
      approval: allow
    - match: "bun run lint*"
      approval: allow
    - match: "bun run check*"
      approval: allow
    - match: "bun run typecheck*"
      approval: allow

    # npm verification
    - match: "npm test*"
      approval: allow
    - match: "npm run test*"
      approval: allow
    - match: "npm run lint*"
      approval: allow
    - match: "npm run check*"
      approval: allow
    - match: "npm run typecheck*"
      approval: allow

    # Basic inspection
    - match: "pwd"
      approval: allow
    - match: "ls*"
      approval: allow

    # Everything else asks
    - match: "*"
      approval: prompt

defaultThinkingLevel: medium

dev:
  autoqaConsent: granted

extendedContext: false

codexResets:
  autoRedeem: "yes"

advisor:
  enabled: false
