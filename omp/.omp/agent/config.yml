modelRoles:
  default: openai-codex/gpt-5.5:medium
  advisor: openai-codex/gpt-5.6-sol:high
  plan: openai-codex/gpt-5.6-sol:high
  slow: openai-codex/gpt-5.6-sol:xhigh
  smol: openai-codex/gpt-5.4-mini:medium
  task: openai-codex/gpt-5.5:medium
task:
  agentModelOverrides:
    task: "@task"
symbolPreset: nerd
composer:
  shape: borderless
theme:
  dark: dark-cosmos
  light: light-github
setupVersion: 2
colorBlindMode: false
images:
  blockImages: false
tools:
  approvalMode: yolo
  approval:
    read: allow
    edit: allow
    bash: allow
bash:
  patterns:
    - match: rm -rf *
      approval: deny
    - match: pwd
      approval: allow
    - match: ls*
      approval: allow
defaultThinkingLevel: medium
dev:
  autoqaConsent: granted
extendedContext: false
codexResets:
  autoRedeem: "no"
advisor:
  enabled: false
statusLine:
  compactThinkingLevel: false
  transparent: false
retry:
  waitForUsageReset: true
  fallbackChains:
    openai-codex/gpt-5.5:
      - google/gemini-3.6-flash
      - openrouter/openrouter/free
      - groq/openai/gpt-oss-120b
  usageAwareFallback: false
  modelFallback: false
display:
  showTokenUsage: true