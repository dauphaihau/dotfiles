modelRoles:
  default: opencode-go/deepseek-v4.1-flash:low
  advisor: openai-codex/gpt-6-astra:high
  slow: openai-codex/gpt-5.6-terra:medium
  smol: opencode-go/deepseek-v4.1-flash:low
  task: opencode-go/kimi-k2.7-code:medium
  architect: openai-codex/gpt-5.6-sol:medium
  architecture-2: openai-codex/gpt-6-astra:low
  architecture-3: opencode-go/glm-5.3-flash:high
  architecture-4: opencode-go/deepseek-v4.1-flash:high
  architecture-5: openai-codex/gpt-6-luna:low
task:
  agentModelOverrides:
    task: "@task"
symbolPreset: nerd
composer:
  shape: borderless
theme:
  dark: dark-cosmos
  light: light-github
setupVersion: 2
colorBlindMode: false
images:
  blockImages: false
tools:
  approvalMode: yolo
  approval:
    read: allow
    edit: allow
    bash: allow
bash:
  patterns:
    - match: rm -rf *
      approval: deny
    - match: pwd
      approval: allow
    - match: ls*
      approval: allow
defaultThinkingLevel: medium
dev:
  autoqaConsent: granted
extendedContext: false
codexResets:
  autoRedeem: "no"
advisor:
  enabled: false
statusLine:
  compactThinkingLevel: false
  transparent: false
retry:
  waitForUsageReset: true
  fallbackChains:
    openai-codex/gpt-5.5:
      - google/gemini-3.6-flash
      - openrouter/openrouter/free
      - groq/openai/gpt-oss-120b
    opencode-go/kimi-k2.7-code:
      - openai-codex/gpt-5.6-sol:low
    opencode-go/deepseek-v4.1-flash:
      - openai-codex/gpt-5.6-sol:medium
  usageAwareFallback: false
  modelFallback: false
display:
  showTokenUsage: true
cycleOrder:
  []